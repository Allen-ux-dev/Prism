name: Import Prism Build 52 source

on:
  push:
    paths:
      - '.upload/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and expand verified source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .upload/chunk-* > /tmp/prism-source.b64
          base64 --decode /tmp/prism-source.b64 > /tmp/prism-source.zip
          tmp="$(mktemp -d)"
          unzip -q /tmp/prism-source.zip -d "$tmp"
          rsync -a "$tmp/" ./ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.upload/' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            --exclude 'NOTICE' \
            --exclude '.gitignore'
          rm -rf .upload
          rm -f .github/workflows/import-prism-source.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat: publish Prism 0.4.1 Build 52 Complete Store"
          git push origin HEAD:main
